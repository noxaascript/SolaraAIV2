<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="SolaraAI local-first AI workspace">
  <title>SolaraAI — Workspace</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">✦</span><span>SolaraAI</span><span class="version">V2</span></div>
      <button id="newChat" class="new-chat">＋ New conversation <kbd>⌘ K</kbd></button>
      <div class="side-label">Workspace</div>
      <button class="nav-item active" data-mode="chat">◌ <span>Chat</span></button>
      <button class="nav-item" data-mode="dev">⌘ <span>Developer</span></button>
      <button class="nav-item" data-mode="browser">◎ <span>Browser</span></button>
      <div class="side-label">Recent</div>
      <div id="recent" class="recent"></div>
      <div class="sidebar-bottom"><div class="status-dot"></div><span>Local runtime ready</span></div>
    </aside>
    <section class="workspace">
      <header class="topbar">
        <div><div class="eyebrow">SOLARAAI WORKSPACE</div><h1 id="modeTitle">Chat</h1></div>
        <div class="controls"><label>Model <select id="model"><option>Auto route</option><option>Qwen</option><option>DeepSeek</option><option>Mistral</option></select></label><button id="clearChat" class="icon-button" title="Clear conversation">⌫</button></div>
      </header>
      <section id="messages" class="messages" aria-live="polite"></section>
      <section class="composer-wrap">
        <div class="suggestions"><button data-prompt="Explain how SolaraAI routing works">Explain routing</button><button data-prompt="Help me debug a Python error">Debug code</button><button data-prompt="/help">Show commands</button></div>
        <form id="inputForm" class="composer">
          <textarea id="messageInput" rows="1" placeholder="Ask SolaraAI anything…"></textarea>
          <div class="composer-footer"><span><kbd>Enter</kbd> send · <kbd>Shift Enter</kbd> new line</span><button id="sendButton" type="submit" aria-label="Send message">↑</button></div>
        </form>
        <p class="fine-print">SolaraAI can make mistakes. Check important information.</p>
      </section>
    </section>
  </main>
<script>
const messages = document.getElementById('messages'), input = document.getElementById('messageInput'), form = document.getElementById('inputForm'), send = document.getElementById('sendButton'), recent = document.getElementById('recent');
let busy = false, conversation = [];
const saved = JSON.parse(localStorage.getItem('solara-conversation') || '[]');
function scrollDown(){ messages.scrollTop = messages.scrollHeight; }
function addMessage(role, text, pending=false){
  const article = document.createElement('article'); article.className = `message ${role}` + (pending ? ' pending' : '');
  article.innerHTML = `<div class="avatar">${role === 'user' ? 'YOU' : role === 'system' ? '!' : '✦'}</div><div class="message-body"><div class="message-meta">${role === 'user' ? 'You' : role === 'system' ? 'System' : 'SolaraAI'} <span>${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span></div><div class="message-text"></div></div>`;
  article.querySelector('.message-text').textContent = text; messages.appendChild(article); scrollDown(); return article;
}
function persist(){ localStorage.setItem('solara-conversation', JSON.stringify(conversation.slice(-30))); }
function render(){
  messages.innerHTML = '';
  if(!conversation.length){ addMessage('assistant', 'Welcome back. What would you like to work on?'); return; }
  conversation.forEach(item => addMessage(item.role === 'user' ? 'user' : 'assistant', item.text));
}
function setMode(mode){
  document.querySelectorAll('.nav-item').forEach(button => button.classList.toggle('active', button.dataset.mode === mode));
  document.getElementById('modeTitle').textContent = mode[0].toUpperCase() + mode.slice(1);
  input.placeholder = mode === 'dev' ? 'Describe a bug, feature, or code change…' : mode === 'browser' ? 'Paste a URL or ask me to research…' : 'Ask SolaraAI anything…';
}
async function sendMessage(event){
  event?.preventDefault(); if(busy) return false;
  const text = input.value.trim(); if(!text) return false;
  busy = true; send.disabled = true; input.value = ''; input.style.height = 'auto';
  conversation.push({role:'user', text}); addMessage('user', text);
  const pending = addMessage('assistant', 'Thinking…', true);
  try{
    const response = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:text})});
    const data = await response.json();
    pending.remove(); const answer = data.error || data.message || 'No response from server.';
    conversation.push({role:'assistant', text:answer}); addMessage(data.error ? 'system' : 'assistant', answer);
    recent.innerHTML = `<div class="recent-item">${text.slice(0, 34)}${text.length > 34 ? '…' : ''}</div>` + recent.innerHTML;
    persist();
  }catch(error){ pending.remove(); addMessage('system', `Connection error: ${error.message}`); }
  finally{ busy = false; send.disabled = false; input.focus(); }
  return false;
}
document.getElementById('newChat').onclick = () => { conversation = []; persist(); render(); input.focus(); };
document.getElementById('clearChat').onclick = () => { conversation = []; persist(); render(); };
document.querySelectorAll('.nav-item').forEach(button => button.onclick = () => setMode(button.dataset.mode));
document.querySelectorAll('[data-prompt]').forEach(button => button.onclick = () => { input.value = button.dataset.prompt; input.focus(); });
input.addEventListener('input', () => { input.style.height='auto'; input.style.height=Math.min(input.scrollHeight, 180)+'px'; });
input.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(e); } });
form.addEventListener('submit', sendMessage);
conversation = saved; render(); input.focus();
</script>
</body>
</html>
